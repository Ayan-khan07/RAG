spring.application.name=Pdf
# Server
server.port=8080

spring.ai.google.genai.embedding.api-key=${api_key}

# Gemini API Key
spring.ai.google.genai.api-key=${api_key}

# Gemini Chat Model
spring.ai.google.genai.chat.model=gemini-3.5-flash

# Gemini Embedding Model
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

# Use the same embedding task for documents and queries
spring.ai.google.genai.embedding.text.task-type=SEMANTIC_SIMILARITY

# Embedding dimensions
spring.ai.google.genai.embedding.text.dimensions=768

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/rag_db
spring.datasource.username=postgres
spring.datasource.password=root123

# PGVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# File upload configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Session configuration
server.servlet.session.timeout=30m

# Session cookie security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

server.servlet.session.cookie.secure=true
# JPA - Development only
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
